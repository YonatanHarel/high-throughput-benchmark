version: '3.9'
services:
server:
  build:
    context: .
    dockerfile: Dockerfile.server
  volumes:
    - ./server/config/server.yaml:/app/server/config/server.yaml
  ports:
    - "8080:8080"
  environment:
    - PORT=8080

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depands_on:
      - server

    grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      depends_on:
        - prometheus